<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHQ Golf Practice 6 Days – Resultados</title>
<style>
:root{
  --bg:#f4f7f4;
  --card:#ffffff;
  --ink:#172019;
  --muted:#667168;
  --green:#176b3a;
  --green-dark:#123d27;
  --green-soft:#e8f3ec;
  --line:#d7dfd9;
  --gold:#fff4cc;
  --red:#9d3434;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
header{
  background:var(--green-dark);
  color:#fff;
  padding:22px 16px;
}
.wrap{max-width:1120px;margin:auto}
.brand{font-size:26px;font-weight:800}
.sub{margin-top:6px;opacity:.92}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-end;
  padding:14px 16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:10;
}
.field{flex:1;min-width:220px}
label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}
input,textarea{
  width:100%;
  border:1px solid #bcc8bf;
  border-radius:8px;
  padding:9px 10px;
  font:inherit;
  background:#fff;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  font-weight:700;
  cursor:pointer;
  background:var(--green);
  color:#fff;
}
button.secondary{background:#e8ece9;color:#18251c}
button.danger{background:var(--red)}
main{padding:0 16px 42px}
.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:18px 0;
}
.tab{
  background:#e4e9e5;
  color:#172019;
}
.tab.active{
  background:var(--green);
  color:#fff;
}
.page{display:none}
.page.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 1px 2px #00000008;
}
h1,h2,h3{margin:0 0 10px}
h1{font-size:24px}
h2{font-size:20px}
h3{font-size:17px;color:#174f30}
.meta{font-size:13px;color:var(--muted)}
.note{
  background:var(--gold);
  border-radius:9px;
  padding:11px 12px;
  margin-top:10px;
}
.timegrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
  margin-top:12px;
}
.timebox{
  background:var(--green-soft);
  border:1px solid #cfe2d4;
  border-radius:9px;
  padding:10px;
}
.timebox b{display:block;font-size:13px}
.timebox span{font-size:12px;color:var(--muted)}
.progress{
  height:10px;
  background:#e2e7e3;
  border-radius:999px;
  overflow:hidden;
  margin:10px 0 6px;
}
.bar{
  height:100%;
  width:0;
  background:var(--green);
}
.section-tag{
  display:inline-block;
  margin-bottom:8px;
  padding:4px 8px;
  border-radius:999px;
  background:#50715d;
  color:#fff;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.drill{
  display:grid;
  grid-template-columns:minmax(0,1fr) 155px 34px;
  gap:9px;
  align-items:center;
  padding:9px 0;
  border-top:1px solid #edf0ed;
}
.drill:first-of-type{border-top:0}
.drill .text{line-height:1.35}
.check{
  width:20px;
  height:20px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}
.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:22px 4px;
}
.summary{
  width:100%;
  min-height:78px;
}
@media(max-width:700px){
  .brand{font-size:21px}
  .toolbar{position:static}
  .drill{grid-template-columns:1fr 95px 28px}
  .drill input{font-size:14px}
}
</style>
</head>

  </div>

<main class="wrap">

const $ = s => document.querySelector(s);
const keyBase = () => `chq6:${($('#studentId').value || $('#student').value || 'default').trim().toLowerCase()}:`;

function slug(s){
  return s.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
}

function render(){
  const tabs = $('#tabs');
  const pages = $('#pages');
  tabs.innerHTML = '';
  pages.innerHTML = '';

  program.forEach((p,pi)=>{
    const b = document.createElement('button');
    b.className = 'tab' + (pi===0 ? ' active' : '');
    b.textContent = p.title;
    b.onclick = () => show(pi);
    tabs.appendChild(b);

    const pg = document.createElement('section');
    pg.className = 'page' + (pi===0 ? ' active' : '');
    pg.dataset.page = pi;

    const total = p.sections.reduce((a,s)=>a+s[1].length,0);

    let top = `
      <div class="card">
        <h1>${p.title}</h1>
        <div class="meta">${p.subtitle}</div>
        <div class="note"><b>Duración:</b> ${p.duration}<br>${p.note}</div>
    `;

    if(p.timeline){
      top += `<div class="timegrid">`;
      p.timeline.forEach(t=>{
        top += `<div class="timebox"><b>${t[0]}</b><span>${t[1]}</span></div>`;
      });
      top += `</div>`;
    }

    top += `
        <div class="progress"><div class="bar"></div></div>
        <div class="meta progtext">0 / ${total} completados</div>
      </div>
    `;

    pg.innerHTML = top;

    p.sections.forEach((sec,si)=>{
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = `<span class="section-tag">${sec[0]}</span>`;

      sec[1].forEach((d,di)=>{
        const id = `${p.key}-${si}-${di}`;
        c.insertAdjacentHTML('beforeend',`
          <div class="drill">
            <div class="text">${d}</div>
            <input data-id="${id}" class="result" placeholder="Resultado">
            <input data-id="${id}" class="check" type="checkbox" title="Completado">
          </div>
        `);
      });

      pg.appendChild(c);
    });

    if(p.key.startsWith('day')){
      const reflection = document.createElement('div');
      reflection.className = 'card';
      reflection.innerHTML = `
        <span class="section-tag">Reflexión del día</span>
        <label>¿Qué hice bien?</label>
        <textarea class="summary" data-summary="${p.key}-good" placeholder="Escribe aquí..."></textarea>
        <br><br>
        <label>¿Qué debo mejorar?</label>
        <textarea class="summary" data-summary="${p.key}-improve" placeholder="Escribe aquí..."></textarea>
      `;
      pg.appendChild(reflection);
    }

    pages.appendChild(pg);
  });

  load();
  bind();
  updateProgress();
}

function show(i){
  document.querySelectorAll('.page').forEach((e,n)=>e.classList.toggle('active',n===i));
  document.querySelectorAll('.tab').forEach((e,n)=>e.classList.toggle('active',n===i));
  window.scrollTo(0,0);
}

function bind(){
  document.querySelectorAll('.result,.check').forEach(el=>el.addEventListener('input',save));
  document.querySelectorAll('.summary').forEach(el=>el.addEventListener('input',saveSummary));
  $('#student').oninput = saveIdentity;
  $('#studentId').oninput = saveIdentity;
}

function saveIdentity(){
  localStorage.setItem('chq6:lastStudent',$('#student').value);
  localStorage.setItem('chq6:lastId',$('#studentId').value);
  load();
}

function save(e){
  const id = e.target.dataset.id;
  const obj = JSON.parse(localStorage.getItem(keyBase()+id) || '{}');

  if(e.target.classList.contains('result')){
    obj.result = e.target.value;
  }else{
    obj.done = e.target.checked;
  }

  localStorage.setItem(keyBase()+id,JSON.stringify(obj));
  updateProgress();
}

function saveSummary(e){
  localStorage.setItem(keyBase()+'summary:'+e.target.dataset.summary,e.target.value);
}

function load(){
  document.querySelectorAll('.result,.check').forEach(el=>{
    const obj = JSON.parse(localStorage.getItem(keyBase()+el.dataset.id) || '{}');

    if(el.classList.contains('result')){
      el.value = obj.result || '';
    }else{
      el.checked = !!obj.done;
    }
  });

  document.querySelectorAll('.summary').forEach(el=>{
    el.value = localStorage.getItem(keyBase()+'summary:'+el.dataset.summary) || '';
  });

  updateProgress();
}

function updateProgress(){
  document.querySelectorAll('.page').forEach(pg=>{
    const checks = [...pg.querySelectorAll('.check')];
    const done = checks.filter(x=>x.checked).length;
    const pct = checks.length ? done/checks.length*100 : 0;

    const bar = pg.querySelector('.bar');
    const text = pg.querySelector('.progtext');

    if(bar) bar.style.width = pct+'%';
    if(text) text.textContent = `${done} / ${checks.length} completados (${Math.round(pct)}%)`;
  });
}

function collect(){
  const out = {
    student:$('#student').value,
    id:$('#studentId').value,
    exported:new Date().toISOString(),
    pages:[]
  };

  program.forEach(p=>{
    const po = {
      title:p.title,
      duration:p.duration,
      sections:[],
      reflection:{}
    };

    p.sections.forEach((s,si)=>{
      const so = {title:s[0],drills:[]};

      s[1].forEach((d,di)=>{
        const id = `${p.key}-${si}-${di}`;
        const o = JSON.parse(localStorage.getItem(keyBase()+id) || '{}');

        so.drills.push({
          drill:d,
          result:o.result || '',
          completed:!!o.done
        });
      });

      po.sections.push(so);
    });

    if(p.key.startsWith('day')){
      po.reflection.good = localStorage.getItem(keyBase()+'summary:'+p.key+'-good') || '';
      po.reflection.improve = localStorage.getItem(keyBase()+'summary:'+p.key+'-improve') || '';
    }

    out.pages.push(po);
  });

  return out;
}

function download(name,text,type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
}

function exportJson(){
  const o = collect();
  download(
    `CHQ-${slug(o.student || 'alumno')}-resultados.json`,
    JSON.stringify(o,null,2),
    'application/json'
  );
}

function exportTxt(){
  const o = collect();
  let t = `CHQ GOLF PRACTICE 6 DAYS\n`;
  t += `Alumno: ${o.student}\n`;
  t += `ID: ${o.id}\n`;
  t += `Exportado: ${new Date().toLocaleString()}\n\n`;

  o.pages.forEach(p=>{
    t += `\n=== ${p.title.toUpperCase()} ===\n`;
    t += `Duración: ${p.duration}\n`;

    p.sections.forEach(s=>{
      t += `\n${s.title}\n`;
      s.drills.forEach(d=>{
        t += `${d.completed ? '[X]' : '[ ]'} ${d.drill} | Resultado: ${d.result}\n`;
      });
    });

    if(p.reflection.good !== undefined){
      t += `\nQué hice bien: ${p.reflection.good}\n`;
      t += `Qué debo mejorar: ${p.reflection.improve}\n`;
    }
  });

  download(
    `CHQ-${slug(o.student || 'alumno')}-resultados.txt`,
    t,
    'text/plain'
  );
}

function resetStudent(){
  const name = $('#student').value || 'este alumno';

  if(confirm(`¿Seguro que quieres borrar todos los resultados guardados de ${name} en este dispositivo?`)){
    const pre = keyBase();
    Object.keys(localStorage)
      .filter(k=>k.startsWith(pre))
      .forEach(k=>localStorage.removeItem(k));

    load();
  }
}

$('#student').value = localStorage.getItem('chq6:lastStudent') || '';
$('#studentId').value = localStorage.getItem('chq6:lastId') || '';
render();
</script>
