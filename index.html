<title>CHQ Programa de Práctica de Golf de 6 Días</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--ink:#172019;--muted:#647067;--accent:#176b3a;--line:#d7dfd9;--warn:#fff5d6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#123d27;color:#fff;padding:22px 18px}.wrap{max-width:1100px;margin:auto}.brand{font-size:25px;font-weight:800}.sub{opacity:.9;margin-top:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff;padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
label{font-size:12px;font-weight:700;color:var(--muted)}input,textarea,select{width:100%;padding:9px;border:1px solid #bcc8bf;border-radius:7px;font:inherit;background:#fff}
.person{min-width:220px;flex:1}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab,button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}
.tab{background:#e4e9e5}.tab.active{background:var(--accent);color:#fff}button{background:var(--accent);color:#fff}.secondary{background:#e8ece9;color:#18251c}.danger{background:#8b2e2e}
main{padding:0 16px 40px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:16px;box-shadow:0 1px 2px #00000008}
h1,h2,h3{margin:0 0 10px}h2{font-size:21px}.meta{color:var(--muted);font-size:13px}
.drill{display:grid;grid-template-columns:minmax(0,1fr) 145px 34px;gap:9px;align-items:center;border-top:1px solid #edf0ed;padding:9px 0}.drill:first-of-type{border-top:0}.drill input{padding:7px}.check{width:20px;height:20px}
.progress{height:10px;background:#e2e7e3;border-radius:10px;overflow:hidden;margin:8px 0}.bar{height:100%;background:var(--accent);width:0}
.section-tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:#50715d;padding:4px 7px;border-radius:999px;display:inline-block;margin-bottom:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.small{font-size:12px}.footer{text-align:center;color:var(--muted);padding:20px}
@media(max-width:650px){.drill{grid-template-columns:1fr 90px 28px}.toolbar{position:static}.brand{font-size:21px}}
@media print{.toolbar,.tabs,.actions{display:none}.page{display:block!important}.card{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CHQ 6 Days"><link rel="manifest" href="manifest.webmanifest"></head>

const $=s=>document.querySelector(s);
const claveBase=()=>`chq6:${($('#studentId').value||$('#student').value||'default').trim().toLowerCase()}:`;
function slug(s){return s.replace(/[^a-z0-9áéíóúñü]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}
function render(){
 const tabs=$('#tabs'), pages=$('#pages'); tabs.innerHTML=''; pages.innerHTML='';
 programa.forEach((p,pi)=>{
   let b=document.createElement('button'); b.className='tab'+(pi===0?' active':''); b.textContent=p.titulo; b.onclick=()=>mostrar(pi); tabs.appendChild(b);
   let pg=document.createElement('section'); pg.className='page'+(pi===0?' active':''); pg.dataset.page=pi;
   let total=p.secciones.reduce((a,s)=>a+s[1].length,0);
   pg.innerHTML=`<div class="card"><h1>${p.titulo}</h1><div class="meta">${p.subtitulo}</div><div class="progress"><div class="bar"></div></div><div class="meta progtext">0 / ${total} completados</div></div>`;
   p.secciones.forEach((sec,si)=>{
     let c=document.createElement('div'); c.className='card'; c.innerHTML=`<span class="section-tag">${sec[0]}</span>`;
     sec[1].forEach((d,di)=>{
       const id=`${p.key}-${si}-${di}`;
       c.insertAdjacentHTML('beforeend',`<div class="drill"><div>${d}</div><input data-id="${id}" class="resultado" placeholder="Resultado"><input data-id="${id}" class="check" type="checkbox" title="Completado"></div>`);
     }); pg.appendChild(c);
   }); pages.appendChild(pg);
 });
 cargar(); enlazar(); actualizarProgreso();
}
function mostrar(i){document.querySelectorAll('.page').forEach((e,n)=>e.classList.toggle('active',n===i));document.querySelectorAll('.tab').forEach((e,n)=>e.classList.toggle('active',n===i));scrollTo(0,0)}
function enlazar(){document.querySelectorAll('.resultado,.check').forEach(el=>el.addEventListener('input',guardar));$('#student').oninput=guardarIdentidad;$('#studentId').oninput=guardarIdentidad}
function guardarIdentidad(){localStorage.setItem('chq6:ultimoAlumno',$('#student').value);localStorage.setItem('chq6:ultimoId',$('#studentId').value);cargar()}
function guardar(e){let id=e.target.dataset.id;let obj=JSON.parse(localStorage.getItem(claveBase()+id)||'{}');if(e.target.classList.contains('resultado'))obj.resultado=e.target.value;else obj.completado=e.target.checked;localStorage.setItem(claveBase()+id,JSON.stringify(obj));actualizarProgreso()}
function cargar(){document.querySelectorAll('.resultado,.check').forEach(el=>{let obj=JSON.parse(localStorage.getItem(claveBase()+el.dataset.id)||'{}');if(el.classList.contains('resultado'))el.value=obj.resultado||'';else el.checked=!!obj.completado});actualizarProgreso()}
function actualizarProgreso(){document.querySelectorAll('.page').forEach(pg=>{let checks=[...pg.querySelectorAll('.check')],done=checks.filter(x=>x.checked).length,pct=checks.length?done/checks.length*100:0;pg.querySelector('.bar').style.width=pct+'%';pg.querySelector('.progtext').textContent=`${done} / ${checks.length} completados (${Math.round(pct)}%)`})}
function recopilar(){let out={alumno:$('#student').value,id:$('#studentId').value,exportado:new Date().toISOString(),paginas:[]};programa.forEach((p,pi)=>{let po={titulo:p.titulo,secciones:[]};p.secciones.forEach((s,si)=>{let so={titulo:s[0],ejercicios:[]};s[1].forEach((d,di)=>{let id=`${p.key}-${si}-${di}`,o=JSON.parse(localStorage.getItem(claveBase()+id)||'{}');so.ejercicios.push({ejercicio:d,resultado:o.resultado||'',completado:!!o.completado})});po.secciones.push(so)});out.paginas.push(po)});return out}
function descargar(nombre,texto,tipo){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:tipo}));a.download=nombre;document.body.appendChild(a);a.click();a.remove()}
async function guardarResultados(){
  const datos = recopilar();

  if (!datos.alumno.trim()) {
    alert("Escribe el nombre del alumno antes de guardar.");
    return;
  }

  const url = "https://script.google.com/macros/s/AKfycbwFLnTcHCY8RvhHSlZiYYxxR_Z-5dMcImKcHkrrNTFGc-Mo3IWeCKvVHThOEbVd-1A/exec";

  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(datos)
    });
    alert("Resultados enviados al coach y guardados en este dispositivo.");
  } catch (error) {
    alert("Los resultados siguen guardados en este dispositivo, pero no se pudieron enviar al coach.");
  }
}

function exportJson(){let o=recopilar();descargar(`CHQ-${slug(o.alumno||'alumno')}-resultados.json`,JSON.stringify(o,null,2),'application/json')}
function exportTxt(){let o=recopilar(),t=`CHQ PROGRAMA DE PRÁCTICA DE GOLF DE 6 DÍAS\nAlumno: ${o.alumno}\nID: ${o.id}\nExportado: ${new Date().toLocaleString('es')}\n\n`;o.paginas.forEach(p=>{t+=`\n=== ${p.titulo.toUpperCase()} ===\n`;p.secciones.forEach(s=>{t+=`\n${s.titulo}\n`;s.ejercicios.forEach(d=>t+=`${d.completado?'[X]':'[ ]'} ${d.ejercicio} | Resultado: ${d.resultado}\n`)})});descargar(`CHQ-${slug(o.alumno||'alumno')}-resultados.txt`,t,'text/plain')}
function resetStudent(){if(confirm("¿Borrar todos los resultados guardados de este alumno en este navegador?")){let pre=claveBase();Object.keys(localStorage).filter(k=>k.startsWith(pre)).forEach(k=>localStorage.removeItem(k));cargar()}}
$('#student').value=localStorage.getItem('chq6:ultimoAlumno')||'';
$('#studentId').value=localStorage.getItem('chq6:ultimoId')||'';
render();
</script>
